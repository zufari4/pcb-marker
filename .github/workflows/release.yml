name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - run: npm test
      - name: Build Windows downloads
        shell: pwsh
        run: |
          npm run release:win 2>&1 | Tee-Object -FilePath build-release.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build-release.log -Tail 80 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            $diagnostic = (Get-Content build-release.log -Tail 45) -join "`n"
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$diagnostic"
            exit $buildExit
          }
      - name: Package npm distribution without publishing
        run: npm pack --ignore-scripts
      - name: Publish downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = Get-Content release/latest-build.json | ConvertFrom-Json
          $directory = Split-Path (Split-Path $latest.executable)
          $files = @(Get-ChildItem -LiteralPath $directory -File | Where-Object { $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          $files += @(Get-ChildItem -Filter '*.tgz' -File | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
            gh release edit $env:RELEASE_TAG --title "PCB Marker $env:RELEASE_TAG" --notes-file releases/NOTES.md
          } else {
            gh release create $env:RELEASE_TAG @files --verify-tag --title "PCB Marker $env:RELEASE_TAG" --notes-file releases/NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
